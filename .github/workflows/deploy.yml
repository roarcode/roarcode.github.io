# Build the site and deploy to GitHub Pages on every push that touches content, design or code.
# One-time setup in the repo:  Settings -> Pages -> Source: "GitHub Actions".
# Optional: Settings -> Secrets and variables -> Actions -> Variables: SITE_URL (e.g. https://guides.example.com).
# Without SITE_URL the default https://<owner>.github.io/<repo> is used (sub-path is handled automatically).
name: Build & deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["content/**", "site-images/**", "scripts/**", "design/**", "src/**", "lib/**", "eleventy.config.js", "package*.json", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes a queued one but never cancels a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # OG images are the slowest build step: keep the render cache between runs (key = hash of anything that changes them).
      - uses: actions/cache@v4
        with:
          path: .cache/og
          key: og-${{ hashFiles('design/og/**', 'design/fonts/**', 'lib/og.js', 'lib/site.js') }}-${{ github.run_id }}
          restore-keys: |
            og-${{ hashFiles('design/og/**', 'design/fonts/**', 'lib/og.js', 'lib/site.js') }}-
      - name: Build (Eleventy + Pagefind)
        env:
          NODE_ENV: production
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          # Optional repo Actions variables; both are OFF/empty by default (see README).
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
          ADS_ENABLED: ${{ vars.ADS_ENABLED }}
          STRICT: "0" # set to "1" to fail the deploy on any invalid content file
        run: npm run build
      - name: Sanity check (SEO tags, JSON-LD, sitemap, search index)
        run: npm run check
      - name: Output gate (no TODO / raw markdown / .md links / broken internal links)
        env:
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: npm run verify
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Tell search engines about the new deploy (IndexNow + sitemap pings). Never fails the workflow.
  notify:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            src/static
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: IndexNow + sitemap ping
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: node scripts/indexnow.mjs
