<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img"><title>Timer / cooldown template</title><defs><linearGradient id="ring" x1="0" x2="1" y1="1" y2="0"><stop offset="0" stop-color="#FF8A3D"/><stop offset="1" stop-color="#FF2E93"/></linearGradient><linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#FF8A3D"/><stop offset="1" stop-color="#FF2E93"/></linearGradient><marker id="arr" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" orient="auto-start-reverse"><path d="M1 1 L10 6 L1 11Z" fill="#19E3F5"/></marker></defs><rect width="1200" height="675" rx="28" fill="#0D0B16"/><rect x="1.5" y="1.5" width="1197" height="672" rx="27" fill="none" stroke="#3B3462" stroke-width="3"/><rect x="0" y="0" width="1200" height="8" rx="4" fill="url(#bar)"/><text x="60" y="84" font-size="40" fill="#F4F1FA" font-family="Syne, Inter, sans-serif" font-weight="800">{{title}}</text><circle cx="330" cy="380" r="150" fill="none" stroke="#1E1A36" stroke-width="30"/><path d="M330 230 A150 150 0 1 1 187.3 426.4" fill="none" stroke="url(#ring)" stroke-width="30" stroke-linecap="round"/><text x="330" y="400" text-anchor="middle" font-size="58" fill="#F4F1FA" font-family="Syne, Inter, sans-serif" font-weight="800">{{time}}</text><text x="330" y="446" font-size="24" fill="#9189AE" font-family="Inter, system-ui, sans-serif" font-weight="600" text-anchor="middle" letter-spacing="4">{{unit}}</text><text x="640" y="250" font-size="26" fill="#19E3F5" font-family="Inter, system-ui, sans-serif" font-weight="600" letter-spacing="5">COOLDOWN</text><text x="640" y="310" font-size="34" fill="#F4F1FA" font-family="Inter, system-ui, sans-serif"  font-weight="700">{{event}}</text><text x="640" y="360" font-size="24" fill="#C4BDDA" font-family="Inter, system-ui, sans-serif" font-weight="600" >{{note}}</text><rect x="640" y="440" width="480" height="18" rx="9" fill="#1E1A36"/><rect x="640" y="440" width="336" height="18" rx="9" fill="url(#ring)"/><path d="M640 470 v14" stroke="#9189AE" stroke-width="3"/><path d="M760 470 v14" stroke="#9189AE" stroke-width="3"/><path d="M880 470 v14" stroke="#9189AE" stroke-width="3"/><path d="M1000 470 v14" stroke="#9189AE" stroke-width="3"/><path d="M1120 470 v14" stroke="#9189AE" stroke-width="3"/><text x="640" y="520" font-size="20" fill="#9189AE" font-family="Inter, system-ui, sans-serif" font-weight="600" >0</text><text x="1100" y="520" font-size="20" fill="#9189AE" font-family="Inter, system-ui, sans-serif" font-weight="600" text-anchor="end">{{max}}</text></svg>
